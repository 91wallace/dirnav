name: Lint & Static Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shell-integration:
    name: Bash and Zsh integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Bash and test installers/integration
        run: |
          bash -n install.sh uninstall.sh dirnav.sh tests/shell/test_bash.sh tests/shell/test_installers.sh
          bash tests/shell/test_bash.sh
          bash tests/shell/test_installers.sh

      - name: Test Zsh integration when available
        if: runner.os == 'macOS'
        run: zsh tests/shell/test_zsh.zsh

  arch-package:
    name: Arch package source, checksum, and build validation
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install runtime build dependency
        run: pacman -Syu --noconfirm --needed python

      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg --syncdeps --noconfirm'

  python-lint:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff Check on dirnav and tests
        run: |
          ruff check dirnav dirnav_operations.py tests/
          ruff format --check dirnav dirnav_operations.py tests/

  powershell-syntax:
    name: PowerShell AST Syntax Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell Scripts Syntax
        shell: pwsh
        run: |
          $scripts = @("dirnav.ps1", "install.ps1", "uninstall.ps1", "tests/shell/Dirnav.Tests.ps1")
          foreach ($s in $scripts) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $s), [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) {
                  Write-Error "Erros de sintaxe em $s : $($errors | Out-String)"
                  exit 1
              }
              Write-Host "[OK] Sintaxe valida: $s" -ForegroundColor Green
          }
